name: vLLM SM80 backport

on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [master]
    paths:
      - .github/workflows/docker-publish.yml
      - ci/sm80/**
  workflow_dispatch:
    inputs:
      retry_conflict:
        description: Retry the same source conflict
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sm80-release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      tag: ${{ steps.plan.outputs.tag }}
      target: ${{ steps.plan.outputs.target }}
      id: ${{ steps.plan.outputs.id }}
      image: ${{ steps.plan.outputs.image }}
      release_ref: ${{ steps.plan.outputs.release_ref }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the stable release and check previous attempts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RETRY: ${{ inputs.retry_conflict || false }}
        run: bash ci/sm80/plan.sh
      - name: Port the maintained delta onto the release
        id: source
        if: steps.plan.outputs.state == 'pending'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          BASE: ${{ steps.plan.outputs.base }}
          TIP: ${{ steps.plan.outputs.tip }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          repo="$RUNNER_TEMP/port-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq -n --arg upstream "$TARGET" --arg base "$BASE" --arg tip "$TIP" \
            '{upstream:$upstream, upstream_base:$base, patch_tip:$tip}' > "$RUNNER_TEMP/report/input.json"
          status=0
          bash ci/sm80/prepare.sh "$repo" "$TARGET" "$BASE" "$TIP" || status=$?
          if [[ $status == 3 ]]; then
            git -C "$repo" diff --name-only --diff-filter=U > "$RUNNER_TEMP/report/conflicts.txt"
            git -C "$repo" diff --cc --no-color > "$RUNNER_TEMP/report/conflicts.diff"
            count=$(awk 'END {print NR}' "$RUNNER_TEMP/report/conflicts.txt")
            echo "::warning title=SM80 port requires resolution::$count conflicting paths"
            {
              echo "### A source port is required"
              echo "Conflicting paths ($count)"
              sed 's/^/- /' "$RUNNER_TEMP/report/conflicts.txt"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $status == 0 ]] || exit "$status"
          tree=$(git -C "$repo" write-tree)
          git -C "$repo" diff --binary --full-index --no-renames --cached "$TARGET" \
            > "$RUNNER_TEMP/report/backport.patch"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Cross-compile the v0.34.0 SM80 kernels and verify MRv2 numerically
        if: steps.source.outputs.ready == 'true' && steps.plan.outputs.tag == 'v0.34.0'
        run: bash ci/sm80/check-v034.sh "$RUNNER_TEMP/port-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.state == 'pending'
        with:
          name: sm80-source-${{ steps.plan.outputs.id }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: error
          retention-days: 30
      - name: Record conflicts and stop before build
        if: steps.source.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.plan.outputs.conflict_ref }}
        run: |
          existing=$(git ls-remote --refs origin "refs/tags/$MARKER")
          if [[ -z $existing ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$MARKER" -f sha="$GITHUB_SHA" > /dev/null
          fi
          echo "::error::Backport conflicts. Download the source report and see ci/sm80/README.md."
          exit 1

  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ${{ vars.SM80_BUILD_RUNNER || 'vllm-sm80-build' }}
    timeout-minutes: 1440
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ needs.prepare.outputs.target }}
      UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
      TREE: ${{ needs.prepare.outputs.tree }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      BUILD_ID: ${{ needs.prepare.outputs.id }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vllm-project/vllm
          ref: ${{ needs.prepare.outputs.target }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sm80-source-${{ needs.prepare.outputs.id }}
          path: report
      - name: Recreate and verify the exact merged tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET"
          if [[ -s ../report/backport.patch ]]; then
            git apply --index --whitespace=nowarn ../report/backport.patch
          fi
          test "$(git write-tree)" = "$TREE"
          git -c user.name=builder -c user.email=builder@localhost -c commit.gpgSign=false \
            commit -q --allow-empty -m "SM80 port of $UPSTREAM_TAG"
          # The Dockerfile bind-mounts .git for setuptools-scm. Keep the local
          # version distinct from both the official release and the fork's tags.
          git -c tag.gpgSign=false tag --no-sign "$UPSTREAM_TAG+sm80.g$BUILD_ID"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the SM80 candidate
        id: build
        working-directory: source
        env:
          JOB_LIMIT: ${{ vars.SM80_MAX_JOBS }}
        run: |
          jobs=${JOB_LIMIT:-$(awk '/MemTotal:/ { n=int($2/4194304); print (n>0?n:1) }' /proc/meminfo)}
          [[ $jobs =~ ^[1-9][0-9]*$ ]]
          cores=$(nproc)
          if (( jobs > cores )); then jobs=$cores; fi
          docker buildx build --platform linux/amd64 --file docker/Dockerfile \
            --target vllm-openai --build-arg torch_cuda_arch_list=8.0 \
            --build-arg "max_jobs=$jobs" --build-arg nvcc_threads=1 \
            --build-arg INSTALL_LMCACHE=true \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$UPSTREAM_TAG-sm80" \
            --label "io.github.vllm-backport.upstream=$TARGET" \
            --label "io.github.vllm-backport.tree=$TREE" \
            --tag "$IMAGE:candidate-$BUILD_ID" \
            --metadata-file "$RUNNER_TEMP/sm80-build.json" --push .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' \
            "$RUNNER_TEMP/sm80-build.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Candidate: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: [prepare, build]
    runs-on: ${{ vars.SM80_TEST_RUNNER || 'vllm-sm80-test' }}
    timeout-minutes: 60
    permissions:
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run offline FP8 and generation checks on SM80
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          DEVICE: ${{ vars.SM80_GPU_DEVICE || '0' }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --gpus "device=$DEVICE" --shm-size=2g \
            -e HF_HUB_OFFLINE=1 -e VLLM_NO_USAGE_STATS=1 \
            -v "$PWD/ci/sm80/smoke.py:/tmp/sm80_smoke.py:ro" \
            --entrypoint python3 "$IMAGE@$DIGEST" /tmp/sm80_smoke.py

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.tag == 'v0.34.0'
        with:
          name: sm80-source-${{ needs.prepare.outputs.id }}
          path: ${{ runner.temp }}/sm80-report
      - name: Run the v0.34.0 sparse MLA and GLM tests on the candidate digest
        if: needs.prepare.outputs.tag == 'v0.34.0'
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          DEVICE: ${{ vars.SM80_GPU_DEVICE || '0' }}
        run: |
          docker run --rm --gpus "device=$DEVICE" --shm-size=2g \
            -e HF_HUB_OFFLINE=1 -e VLLM_NO_USAGE_STATS=1 -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            -v "$RUNNER_TEMP/sm80-report/runtime-tests:/checks:ro" \
            --entrypoint /bin/bash "$IMAGE@$DIGEST" -ec '
              python3 -m pip install --disable-pip-version-check --no-index \
                --find-links /checks/wheels --target /tmp/sm80-pytest pytest==9.2.0
              export PYTHONPATH="/tmp/sm80-pytest${PYTHONPATH:+:$PYTHONPATH}"
              cd /tmp
              python3 -m pytest --noconftest --import-mode=importlib -p no:cacheprovider \
                -q -ra /checks/test_*.py
            '

  publish:
    needs: [prepare, build, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      UPSTREAM_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ needs.prepare.outputs.target }}
      TREE: ${{ needs.prepare.outputs.tree }}
      RELEASE_REF: ${{ needs.prepare.outputs.release_ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sm80-source-${{ needs.prepare.outputs.id }}
          path: report
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote the tested digest and publish the source patch
        run: |
          official=$(gh api "repos/vllm-project/vllm/commits/$UPSTREAM_TAG" --jq .sha)
          test "$official" = "$TARGET"
          tags=(-t "$IMAGE:$UPSTREAM_TAG-sm80")
          latest=$(gh api repos/vllm-project/vllm/releases/latest --jq .tag_name)
          current=$(gh api "repos/vllm-project/vllm/commits/$latest" --jq .sha)
          if [[ $latest == "$UPSTREAM_TAG" && $current == "$TARGET" ]]; then
            tags+=(-t "$IMAGE:latest-sm80")
          fi
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE@$DIGEST"
          jq --arg tag "$UPSTREAM_TAG" --arg tree "$TREE" --arg image "$IMAGE@$DIGEST" \
            --arg workflow "$GITHUB_SHA" '. + {tag:$tag, tree:$tree, image:$image, workflow:$workflow}' \
            report/input.json > report/build.json
          notes="Tested on SM80. Pull $IMAGE@$DIGEST. Apply backport.patch to upstream commit $TARGET to reproduce source tree $TREE. The release tag identifies the CI revision."
          if gh release view "$RELEASE_REF" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_REF" -R "$GITHUB_REPOSITORY" --clobber \
              report/build.json report/backport.patch
            gh release edit "$RELEASE_REF" -R "$GITHUB_REPOSITORY" --draft=false --latest=false --notes "$notes"
          else
            gh release create "$RELEASE_REF" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest=false --title "$UPSTREAM_TAG SM80" --notes "$notes" \
              report/build.json report/backport.patch
          fi
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
