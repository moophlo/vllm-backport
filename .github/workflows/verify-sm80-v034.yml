name: Verify v0.34 SM80 source port
on:
  push:
    branches: [ci/sm80-v034-port]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Import the pinned release into the fork's Git object store
        env:
          TARGET: 62d4bc3c7e33b1b6c906e233e6af2d3506c482ca
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$TARGET" HEAD 2>/dev/null; then
            git fetch --no-tags https://github.com/vllm-project/vllm.git refs/tags/v0.34.0
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$TARGET"
            bridge=$(git -c user.name='SM80 port CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit-tree 'HEAD^{tree}' -p HEAD -p "$TARGET" -m 'Import the official v0.34.0 parent for the source port')
            git push origin "$bridge:refs/heads/ci/sm80-v034-port"
          fi
      - name: Check the integrated source
        if: hashFiles('ci/sm80/check-v034.sh') != ''
        run: bash ci/sm80/check-v034.sh

  a100:
    needs: source
    runs-on: ${{ vars.SM80_TEST_RUNNER || 'vllm-sm80-test' }}
    timeout-minutes: 1440
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and run the candidate locally on SM80
        env:
          DEVICE: ${{ vars.SM80_GPU_DEVICE || '0' }}
          JOB_LIMIT: ${{ vars.SM80_MAX_JOBS }}
        run: |
          set -euo pipefail
          tip=$(jq -er '.patch_tip' ci/sm80/port.json)
          base=$(jq -er '.upstream_base' ci/sm80/port.json)
          dir="$RUNNER_TEMP/sm80-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash ci/sm80/prepare.sh "$dir" "$base" "$base" "$tip"
          git -C "$dir" -c user.name=builder -c user.email=builder@localhost commit --allow-empty -qm 'SM80 qualification'
          git -C "$dir" -c tag.gpgSign=false tag "v0.34.0+sm80.g${tip:0:12}"
          jobs=${JOB_LIMIT:-$(awk '/MemTotal:/ { n=int($2/4194304); print (n>0?n:1) }' /proc/meminfo)}
          [[ $jobs =~ ^[1-9][0-9]*$ ]]
          cores=$(nproc)
          (( jobs <= cores )) || jobs=$cores
          image="vllm-sm80-verify:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          docker buildx build --load --platform linux/amd64 -f "$dir/docker/Dockerfile" \
            --target vllm-openai --build-arg torch_cuda_arch_list=8.0 \
            --build-arg "max_jobs=$jobs" --build-arg nvcc_threads=1 \
            --build-arg INSTALL_LMCACHE=true -t "$image" "$dir"
          docker run --rm --gpus "device=$DEVICE" --shm-size=2g \
            -e HF_HUB_OFFLINE=1 -e VLLM_NO_USAGE_STATS=1 \
            -v "$PWD/ci/sm80/smoke.py:/tmp/sm80_smoke.py:ro" \
            --entrypoint python3 "$image" /tmp/sm80_smoke.py
